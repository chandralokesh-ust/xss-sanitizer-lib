plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.xss.security'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring (EXPOSED to consumers)
    api 'org.springframework.boot:spring-boot-starter-web:2.7.18'

    // Exposed dependency
    api 'org.apache.commons:commons-math3:3.6.1'

    // Internal dependency
    implementation 'com.google.guava:guava:32.1.3-jre'

    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260101.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/chandralokesh-ust/xss-sanitizer-lib")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

test {
    useJUnitPlatform()
}