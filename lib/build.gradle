plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}


group = 'com.xss.security'
version = '1.0.0'

// Set Java compatibility to 21
sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'
    // Lombok for annotation processing
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:32.1.3-jre'

    // Spring Boot Starter Web (includes Spring, Jackson, and Servlet API)
    implementation 'org.springframework.boot:spring-boot-starter-web:2.7.18'

    // Jackson Databind (explicit, though included in starter-web)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'

    // Servlet API (explicit, though included in starter-web)
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
    // Lombok for annotation processing
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('5.9.1')
        }
    }
}
